# ==============================================================================
# RakshakGIS Production Docker Compose Manifest
# Architecture: Isolated internal DB, unprivileged backend, standalone frontend
# Security: Required explicit secrets, non-root execution, private DB networking
# ==============================================================================

name: rakshakgis-prod

services:
  # Database Service: PostgreSQL 16 with PostGIS 3.4
  # Access is strictly private to internal bridge network (no host ports published)
  db:
    image: postgis/postgis:16-3.4
    container_name: rakshakgis-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rakshakgis}
      POSTGRES_USER: ${POSTGRES_USER:-rakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakshak} -d ${POSTGRES_DB:-rakshakgis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rakshak_network

  # Backend Service: Hardened FastAPI service (unprivileged appuser, no --reload)
  backend:
    image: ${BACKEND_IMAGE:-swapnil220705/rakshakgis-backend:v0.1.0}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rakshakgis-prod-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PROD_DATABASE_URL:-postgresql://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@db:5432/${POSTGRES_DB:-rakshakgis}}
      APP_ENV: ${APP_ENV:-production}
      DATA_MODE: ${DATA_MODE:-demo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      IMD_API_KEY: ${IMD_API_KEY:-}
      IMD_BASE_URL: ${IMD_BASE_URL:-}
      GEOSERVER_URL: ${GEOSERVER_URL:-}
      GEOSERVER_USER: ${GEOSERVER_USER:-}
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD:-}
      OSM_ROUTING_URL: ${OSM_ROUTING_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
    ports:
      # Restrict backend access to localhost loopback only (never published publicly)
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rakshak_network

  # Frontend Service: Next.js 14 Standalone runner with same-origin API proxying
  frontend:
    image: ${FRONTEND_IMAGE:-swapnil220705/rakshakgis-frontend:v0.1.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_DATA_MODE: ${DATA_MODE:-demo}
    container_name: rakshakgis-prod-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      PORT: 3000
      NODE_ENV: production
    ports:
      # Production web traffic served on port 80 (or custom FRONTEND_PORT)
      - "${FRONTEND_PORT:-80}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rakshak_network

volumes:
  pgdata:
    name: ${POSTGRES_PROD_VOLUME_NAME:-rakshakgis_prod_pgdata}

networks:
  rakshak_network:
    name: ${PROD_NETWORK_NAME:-rakshakgis_prod_network}
    driver: bridge
