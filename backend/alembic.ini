# RakshakGIS Alembic Migration Configuration

[alembic]
# Path to migration scripts folder (relative to this file)
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Sys.path prepend to allow importing app modules
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Fallback database URL (env.py dynamically overrides this with app.core.config.get_settings().DATABASE_URL)
sqlalchemy.url = postgresql://rakshak:rakshak_dev_secret@db:5432/rakshakgis

[post_write_hooks]
# Post write hooks for formatting (optional)

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
